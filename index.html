<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=5.0,
                 user-scalable=yes">

    <title>ZBD04A火控程序</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;

            background: white;

            font-family:
                Arial,
                "Microsoft YaHei",
                "PingFang SC",
                sans-serif;

            overflow: hidden;
        }


        /* =========================
           整体布局
           ========================= */

        .main-container {
            width: 100vw;
            height: 100vh;

            display: flex;
            flex-direction: row;

            align-items: stretch;

            background: white;
        }


        /* =========================
           左侧地图
           ========================= */

        .map-container {
            flex: 1;

            min-width: 0;
            height: 100vh;

            display: flex;

            justify-content: center;
            align-items: center;

            padding: 4px;

            overflow: hidden;
        }


        #mapSvg {
            display: block;

            width: 100%;
            height: 100%;

            max-width: 100%;
            max-height: 100%;

            background: white;

            touch-action: none;

            user-select: none;
            -webkit-user-select: none;
        }


        /* =========================
           右侧控制栏
           ========================= */

        .control-panel {

            width: 220px;
            min-width: 220px;

            height: 100vh;

            padding: 7px 9px;

            background: white;

            border-left: 1px solid #dddddd;

            overflow-y: auto;

            flex-shrink: 0;
        }


        /* 标题 */

        .section-title {

            font-size: 15px;
            font-weight: bold;

            text-align: center;

            margin-top: 2px;
            margin-bottom: 4px;
        }


        /* =========================
           比例尺
           ========================= */

        .scale-row {

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 4px;

            font-size: 12px;

            margin-bottom: 3px;
        }


        input {

            width: 68px;
            height: 29px;

            padding: 2px 4px;

            font-size: 14px;

            text-align: center;

            border: 1px solid #999999;

            border-radius: 4px;

            background: white;
        }


        /* =========================
           按钮
           ========================= */

        button {

            display: block;

            width: 100%;

            height: 32px;

            margin: 4px auto;

            padding: 0;

            border: 1px solid #bbbbbb;

            border-radius: 6px;

            background: #eeeeee;

            font-size: 12px;

            color: #007aff;

            cursor: pointer;
        }


        button:active {

            background: #dddddd;

        }


        /* 小间隔 */

        .spacer {

            height: 4px;

        }


        /* =========================
           当前模式
           ========================= */

        .mode-label {

            margin-top: 6px;
            margin-bottom: 4px;

            text-align: center;

            font-size: 10px;

            color: #444444;
        }


        /* =========================
           结果显示
           ========================= */

        .result {

            margin-top: 4px;

            white-space: pre-line;

            font-family:
                Arial,
                "Microsoft YaHei",
                "PingFang SC",
                sans-serif;

            font-size: 10px;

            line-height: 1.22;

            text-align: left;

            color: #222222;
        }


        /* =========================
           较小的平板
           ========================= */

        @media (max-width: 1100px) {

            .control-panel {

                width: 205px;
                min-width: 205px;

                padding: 6px 7px;
            }


            .section-title {

                font-size: 14px;

                margin-top: 1px;
                margin-bottom: 3px;
            }


            .scale-row {

                font-size: 11px;

                margin-bottom: 2px;
            }


            input {

                width: 63px;
                height: 27px;

                font-size: 13px;
            }


            button {

                height: 30px;

                margin: 3px auto;

                font-size: 11px;
            }


            .spacer {

                height: 3px;
            }


            .mode-label {

                margin-top: 4px;
                margin-bottom: 3px;

                font-size: 9px;
            }


            .result {

                margin-top: 3px;

                font-size: 9px;

                line-height: 1.18;
            }
        }


        /* =========================
           更窄屏幕
           ========================= */

        @media (max-width: 850px) {

            .control-panel {

                width: 190px;
                min-width: 190px;

                padding: 5px 6px;
            }


            .section-title {

                font-size: 13px;
            }


            button {

                height: 29px;

                font-size: 10px;
            }


            .result {

                font-size: 8.5px;

                line-height: 1.15;
            }

        }


    </style>

</head>


<body>


<div class="main-container">


    <!-- =========================
         地图
         ========================= -->

    <div class="map-container">


        <svg
            id="mapSvg"
            viewBox="0 0 700 700"
            preserveAspectRatio="xMidYMid meet"
            xmlns="http://www.w3.org/2000/svg">


            <!-- 背景 -->

            <rect
                x="0"
                y="0"
                width="700"
                height="700"
                fill="white">
            </rect>


            <!-- =========================
                 纵向网格线
                 ========================= -->

            <line x1="70"  y1="70" x2="70"  y2="630"
                  stroke="black" stroke-width="1"/>

            <line x1="150" y1="70" x2="150" y2="630"
                  stroke="black" stroke-width="1"/>

            <line x1="230" y1="70" x2="230" y2="630"
                  stroke="black" stroke-width="1"/>

            <line x1="310" y1="70" x2="310" y2="630"
                  stroke="black" stroke-width="1"/>

            <line x1="390" y1="70" x2="390" y2="630"
                  stroke="black" stroke-width="1"/>

            <line x1="470" y1="70" x2="470" y2="630"
                  stroke="black" stroke-width="1"/>

            <line x1="550" y1="70" x2="550" y2="630"
                  stroke="black" stroke-width="1"/>

            <line x1="630" y1="70" x2="630" y2="630"
                  stroke="black" stroke-width="1"/>


            <!-- =========================
                 横向网格线
                 ========================= -->

            <line x1="70" y1="70"  x2="630" y2="70"
                  stroke="black" stroke-width="1"/>

            <line x1="70" y1="150" x2="630" y2="150"
                  stroke="black" stroke-width="1"/>

            <line x1="70" y1="230" x2="630" y2="230"
                  stroke="black" stroke-width="1"/>

            <line x1="70" y1="310" x2="630" y2="310"
                  stroke="black" stroke-width="1"/>

            <line x1="70" y1="390" x2="630" y2="390"
                  stroke="black" stroke-width="1"/>

            <line x1="70" y1="470" x2="630" y2="470"
                  stroke="black" stroke-width="1"/>

            <line x1="70" y1="550" x2="630" y2="550"
                  stroke="black" stroke-width="1"/>

            <line x1="70" y1="630" x2="630" y2="630"
                  stroke="black" stroke-width="1"/>


            <!-- =========================
                 顶部数字
                 ========================= -->

            <g
                font-family="Arial"
                font-size="18"
                font-weight="bold"
                fill="black"
                text-anchor="middle">

                <text x="110" y="45">1</text>
                <text x="190" y="45">2</text>
                <text x="270" y="45">3</text>
                <text x="350" y="45">4</text>
                <text x="430" y="45">5</text>
                <text x="510" y="45">6</text>
                <text x="590" y="45">7</text>

            </g>


            <!-- =========================
                 左侧字母
                 ========================= -->

            <g
                font-family="Arial"
                font-size="18"
                font-weight="bold"
                fill="black"
                text-anchor="middle"
                dominant-baseline="middle">

                <text x="42" y="110">A</text>
                <text x="42" y="190">B</text>
                <text x="42" y="270">C</text>
                <text x="42" y="350">D</text>
                <text x="42" y="430">E</text>
                <text x="42" y="510">F</text>
                <text x="42" y="590">G</text>

            </g>


            <!-- =========================
                 自身 - 目标连线
                 ========================= -->

            <line
                id="connectionLine"

                x1="0"
                y1="0"

                x2="0"
                y2="0"

                stroke="black"

                stroke-width="2"

                stroke-dasharray="6 4"

                visibility="hidden">
            </line>


            <!-- =========================
                 自身标记
                 ========================= -->

            <g
                id="ownMarker"
                visibility="hidden">

                <circle
                    id="ownCircle"

                    cx="0"
                    cy="0"

                    r="8"

                    fill="blue">
                </circle>

                <text
                    id="ownMarkerText"

                    x="0"
                    y="0"

                    fill="blue"

                    font-family="Arial"

                    font-size="14"

                    font-weight="bold"

                    text-anchor="middle">

                    OWN

                </text>

            </g>


            <!-- =========================
                 目标标记
                 ========================= -->

            <g
                id="targetMarker"
                visibility="hidden">

                <circle
                    id="targetCircle"

                    cx="0"
                    cy="0"

                    r="8"

                    fill="red">
                </circle>

                <text
                    id="targetMarkerText"

                    x="0"
                    y="0"

                    fill="red"

                    font-family="Arial"

                    font-size="14"

                    font-weight="bold"

                    text-anchor="middle">

                    TARGET

                </text>

            </g>


        </svg>


    </div>



    <!-- =========================
         右侧控制栏
         ========================= -->

    <div class="control-panel">


        <!-- 比例尺 -->

        <div class="section-title">

            地图比例尺

        </div>


        <div class="scale-row">

            <span>1 格 =</span>

            <input
                id="scaleInput"
                type="number"
                inputmode="decimal"
                step="0.1">

            <span>m</span>

        </div>


        <button id="applyScaleButton">

            应用比例尺

        </button>



        <div class="spacer"></div>



        <!-- 位置 -->


        <div class="section-title">

            位置设置

        </div>


        <button id="ownButton">

            设置自身位置

        </button>


        <button id="targetButton">

            设置目标位置

        </button>



        <div class="spacer"></div>



        <!-- 清除 -->


        <div class="section-title">

            清除

        </div>


        <button id="clearTargetButton">

            清除目标位置

        </button>


        <button id="clearAllButton">

            全部清零

        </button>



        <!-- 当前模式 -->


        <div
            id="modeLabel"
            class="mode-label">

            当前模式：未选择

        </div>



        <!-- 结果 -->


        <div
            id="resultLabel"
            class="result">
        </div>


    </div>


</div>



<script>


/* =========================
   基础参数
   ========================= */


const GRID_SIZE = 7;

const CELL_SIZE = 80;

const MAP_LEFT = 70;

const MAP_TOP = 70;

const MAP_SIZE =
    GRID_SIZE * CELL_SIZE;



/* =========================
   数据状态
   ========================= */


let scale = null;

let ownPoint = null;

let targetPoint = null;

let selectionMode = null;



/* =========================
   获取网页元素
   ========================= */


const svg =
    document.getElementById("mapSvg");


const scaleInput =
    document.getElementById("scaleInput");


const applyScaleButton =
    document.getElementById("applyScaleButton");


const ownButton =
    document.getElementById("ownButton");


const targetButton =
    document.getElementById("targetButton");


const clearTargetButton =
    document.getElementById("clearTargetButton");


const clearAllButton =
    document.getElementById("clearAllButton");


const modeLabel =
    document.getElementById("modeLabel");


const resultLabel =
    document.getElementById("resultLabel");


const ownMarker =
    document.getElementById("ownMarker");


const ownCircle =
    document.getElementById("ownCircle");


const ownMarkerText =
    document.getElementById("ownMarkerText");


const targetMarker =
    document.getElementById("targetMarker");


const targetCircle =
    document.getElementById("targetCircle");


const targetMarkerText =
    document.getElementById("targetMarkerText");


const connectionLine =
    document.getElementById("connectionLine");



/* =========================
   设置模式
   ========================= */


function selectOwnMode() {

    selectionMode = "own";

    modeLabel.textContent =
        "当前模式：设置自身位置";

}


function selectTargetMode() {

    selectionMode = "target";

    modeLabel.textContent =
        "当前模式：设置目标位置";

}



/* =========================
   屏幕坐标转换 SVG 坐标
   ========================= */


function getSvgPoint(event) {

    const point =
        svg.createSVGPoint();


    point.x =
        event.clientX;

    point.y =
        event.clientY;


    const matrix =
        svg.getScreenCTM();


    if (!matrix) {

        return null;

    }


    const transformed =
        point.matrixTransform(
            matrix.inverse()
        );


    return {

        x: transformed.x,

        y: transformed.y

    };

}



/* =========================
   点击地图
   ========================= */


function mapClick(event) {


    if (selectionMode === null) {

        alert(
            "请先点击“设置自身位置”或“设置目标位置”"
        );

        return;

    }


    const point =
        getSvgPoint(event);


    if (!point) {

        return;

    }


    const mapX =
        point.x - MAP_LEFT;


    const mapY =
        point.y - MAP_TOP;



    if (
        mapX < 0 ||
        mapY < 0 ||
        mapX >= MAP_SIZE ||
        mapY >= MAP_SIZE
    ) {

        return;

    }



    if (selectionMode === "own") {

        ownPoint = {

            x: mapX,

            y: mapY

        };

    }


    else if (
        selectionMode === "target"
    ) {

        targetPoint = {

            x: mapX,

            y: mapY

        };

    }



    selectionMode = null;


    modeLabel.textContent =
        "当前模式：未选择";


    updateMarkers();

    updateResult();

}



/* =========================
   更新地图标记
   ========================= */


function updateMarkers() {


    if (ownPoint) {


        const x =
            MAP_LEFT + ownPoint.x;


        const y =
            MAP_TOP + ownPoint.y;



        ownCircle.setAttribute(
            "cx",
            x
        );


        ownCircle.setAttribute(
            "cy",
            y
        );


        ownMarkerText.setAttribute(
            "x",
            x
        );


        ownMarkerText.setAttribute(
            "y",
            y - 15
        );


        ownMarker.setAttribute(
            "visibility",
            "visible"
        );

    }


    else {

        ownMarker.setAttribute(
            "visibility",
            "hidden"
        );

    }



    if (targetPoint) {


        const x =
            MAP_LEFT + targetPoint.x;


        const y =
            MAP_TOP + targetPoint.y;



        targetCircle.setAttribute(
            "cx",
            x
        );


        targetCircle.setAttribute(
            "cy",
            y
        );


        targetMarkerText.setAttribute(
            "x",
            x
        );


        targetMarkerText.setAttribute(
            "y",
            y - 15
        );


        targetMarker.setAttribute(
            "visibility",
            "visible"
        );

    }


    else {

        targetMarker.setAttribute(
            "visibility",
            "hidden"
        );

    }



    if (
        ownPoint &&
        targetPoint
    ) {


        connectionLine.setAttribute(
            "x1",
            MAP_LEFT + ownPoint.x
        );


        connectionLine.setAttribute(
            "y1",
            MAP_TOP + ownPoint.y
        );


        connectionLine.setAttribute(
            "x2",
            MAP_LEFT + targetPoint.x
        );


        connectionLine.setAttribute(
            "y2",
            MAP_TOP + targetPoint.y
        );


        connectionLine.setAttribute(
            "visibility",
            "visible"
        );

    }


    else {

        connectionLine.setAttribute(
            "visibility",
            "hidden"
        );

    }

}



/* =========================
   坐标转换
   ========================= */


function pixelToCoordinate(
    x,
    y
) {


    const gx =
        x / CELL_SIZE;


    const gy =
        y / CELL_SIZE;



    let column =
        Math.floor(gx);


    let row =
        Math.floor(gy);



    column =
        Math.max(
            0,
            Math.min(
                GRID_SIZE - 1,
                column
            )
        );


    row =
        Math.max(
            0,
            Math.min(
                GRID_SIZE - 1,
                row
            )
        );



    const number =
        column + 1;


    const letter =
        String.fromCharCode(
            "A".charCodeAt(0) + row
        );


    const xFraction =
        gx - column;


    const yFraction =
        gy - row;



    return {

        number: number,

        letter: letter,

        xFraction: xFraction,

        yFraction: yFraction

    };

}



/* =========================
   坐标文字
   ========================= */


function formatCoordinate(point) {


    if (!point) {

        return "未设置";

    }


    const data =
        pixelToCoordinate(
            point.x,
            point.y
        );


    return (

        "横 " +

        data.number +

        " + " +

        data.xFraction.toFixed(2) +

        " 格，纵 " +

        data.letter +

        " + " +

        data.yFraction.toFixed(2) +

        " 格"

    );

}



/* =========================
   距离计算
   ========================= */


function calculateDistance() {


    if (
        !ownPoint ||
        !targetPoint
    ) {

        return null;

    }



    const dxGrid =

        Math.abs(
            targetPoint.x -
            ownPoint.x
        )

        / CELL_SIZE;



    const dyGrid =

        Math.abs(
            targetPoint.y -
            ownPoint.y
        )

        / CELL_SIZE;



    const gridDistance =

        Math.sqrt(

            dxGrid ** 2 +

            dyGrid ** 2

        );



    return {

        dxGrid: dxGrid,

        dyGrid: dyGrid,

        gridDistance: gridDistance

    };

}



/* =========================
   设置比例尺
   ========================= */


function updateScale() {


    const text =
        scaleInput.value.trim();


    if (text === "") {


        alert(
            "请输入比例尺，例如 157"
        );


        return;

    }



    const value =
        Number(text);



    if (
        !Number.isFinite(value) ||
        value <= 0
    ) {


        alert(
            "请输入有效比例尺，例如 157"
        );


        return;

    }



    scale = value;


    updateResult();

}



/* =========================
   更新结果
   ========================= */


function updateResult() {


    const ownText =
        formatCoordinate(
            ownPoint
        );


    const targetText =
        formatCoordinate(
            targetPoint
        );



    let text = "";


    text +=
        "自身：" +
        ownText +
        "\n";


    text +=
        "目标：" +
        targetText +
        "\n";


    if (scale === null) {

        text +=
            "比例尺：未设置\n";

    }

    else {

        text +=
            "比例尺：1格 = " +
            scale.toFixed(1) +
            " m\n";

    }



    const distance =
        calculateDistance();



    if (distance) {


        text +=
            "\n──────── 距离 ────────\n";


        if (scale !== null) {


            text +=

                "横向：" +

                distance.dxGrid.toFixed(2) +

                " 格 / " +

                (
                    distance.dxGrid *
                    scale
                ).toFixed(1) +

                " m\n";



            text +=

                "纵向：" +

                distance.dyGrid.toFixed(2) +

                " 格 / " +

                (
                    distance.dyGrid *
                    scale
                ).toFixed(1) +

                " m\n";



            text +=

                "直线：" +

                distance.gridDistance.toFixed(2) +

                " 格 / " +

                (
                    distance.gridDistance *
                    scale
                ).toFixed(1) +

                " m";

        }


        else {


            text +=

                "横向：" +

                distance.dxGrid.toFixed(2) +

                " 格\n";



            text +=

                "纵向：" +

                distance.dyGrid.toFixed(2) +

                " 格\n";



            text +=

                "直线：" +

                distance.gridDistance.toFixed(2) +

                " 格\n";


            text +=
                "请输入比例尺计算米数。";

        }

    }



    resultLabel.textContent =
        text;

}



/* =========================
   清除目标
   ========================= */


function clearTarget() {


    targetPoint = null;


    selectionMode = null;


    modeLabel.textContent =
        "当前模式：未选择";


    updateMarkers();

    updateResult();

}



/* =========================
   全部清零
   ========================= */


function clearAll() {


    ownPoint = null;

    targetPoint = null;

    selectionMode = null;


    modeLabel.textContent =
        "当前模式：未选择";


    updateMarkers();

    updateResult();

}



/* =========================
   按钮事件
   ========================= */


ownButton.addEventListener(
    "click",
    selectOwnMode
);


targetButton.addEventListener(
    "click",
    selectTargetMode
);


applyScaleButton.addEventListener(
    "click",
    updateScale
);


clearTargetButton.addEventListener(
    "click",
    clearTarget
);


clearAllButton.addEventListener(
    "click",
    clearAll
);



/* =========================
   地图点击
   ========================= */


svg.addEventListener(
    "pointerdown",
    mapClick
);



/* =========================
   防止 iPad 拖动地图
   ========================= */


svg.addEventListener(

    "touchstart",

    function(event) {

        event.preventDefault();

    },

    {

        passive: false

    }

);



/* =========================
   初始化
   ========================= */


updateMarkers();

updateResult();


</script>


</body>

</html>
