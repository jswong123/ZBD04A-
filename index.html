<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=5.0,
                 user-scalable=yes">

    <title>ZBD04A火控程序</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;

            background: white;

            font-family：
                "FangSong",
                "STFangsong",
                "仿宋",
                "FangSong_GB2312",
                serif;

            overflow: hidden;
        }


        /* =========================
           主布局
           ========================= */

        .main-container {
            width: 100vw;
            height: 100vh;

            display: flex;
            flex-direction: row;

            background: white;
        }


        /* =========================
           左侧地图区域
           ========================= */

        .map-container {
            flex: 1;
            min-width: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 5px;

            overflow: auto;

            background: white;
        }


        .map-stage {
            width: 100%;
            height: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            flex-shrink: 0;
        }


        #mapSvg {
            display: block;

            width: 100%;
            height: 100%;

            background: white;

            user-select: none;
            -webkit-user-select: none;

            touch-action: pan-x pan-y;
        }


        /* =========================
           右侧控制栏
           ========================= */

        .control-panel {

            width: 235px;
            min-width: 235px;

            height: 100vh;

            padding: 8px 10px;

            background: white;

            border-left: 1px solid #dddddd;

            overflow-y: auto;

            flex-shrink: 0;
        }


        /* =========================
           标题
           ========================= */

        .section-title {

            font-size: 15px;
            font-weight: bold;

            text-align: center;

            margin-top: 3px;
            margin-bottom: 5px;
        }


        /* =========================
           比例尺
           ========================= */

        .scale-row {

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 5px;

            font-size: 12px;

            margin-bottom: 4px;
        }


        input[type="number"] {

            width: 72px;
            height: 32px;

            padding: 2px 4px;

            font-size: 14px;

            text-align: center;

            border: 1px solid #999999;

            border-radius: 6px;

            background: white;
        }


        /* =========================
           普通按钮
           ========================= */

        button {

            display: block;

            width: 100%;

            height: 40px;

            margin: 5px auto;

            padding: 0 6px;

            border: 1px solid #bbbbbb;

            border-radius: 9px;

            background: #eeeeee;

            font-size: 13px;

            color: #007aff;

            cursor: pointer;
        }


        button:active {

            background: #dddddd;

        }


        /* =========================
           缩放区域
           ========================= */

        .zoom-row {

            display: flex;

            align-items: center;

            gap: 5px;

            margin-bottom: 4px;
        }


        .zoom-button {

            width: 40px;
            min-width: 40px;

            height: 36px;

            margin: 0;

            padding: 0;

            font-size: 19px;
            font-weight: bold;

            border-radius: 8px;
        }


        #zoomSlider {

            flex: 1;

            min-width: 0;

            height: 30px;
        }


        .zoom-value {

            width: 45px;

            font-size: 11px;

            text-align: center;

            white-space: nowrap;
        }


        .reset-zoom-button {

            height: 34px;

            margin-top: 3px;

            font-size: 11px;
        }


        /* =========================
           间隔
           ========================= */

        .spacer {

            height: 4px;

        }


        /* =========================
           当前模式
           ========================= */

        .mode-label {

            margin-top: 6px;
            margin-bottom: 4px;

            text-align: center;

            font-size: 10px;

            color: #444444;
        }


        /* =========================
           结果
           ========================= */

        .result {

            margin-top: 4px;

            white-space: pre-line;

            font-family:
                Arial,
                "Microsoft YaHei",
                "PingFang SC",
                sans-serif;

            font-size: 10px;

            line-height: 1.22;

            color: #222222;
        }


        /* =========================
           iPad / 较小平板
           ========================= */

        @media (max-width: 1100px) {

            .control-panel {

                width: 220px;
                min-width: 220px;

                padding: 6px 8px;
            }


            .section-title {

                font-size: 14px;

                margin-bottom: 4px;
            }


            button {

                height: 38px;

                margin: 4px auto;

                font-size: 12px;
            }


            .zoom-button {

                width: 37px;
                min-width: 37px;

                height: 34px;

                font-size: 18px;
            }


            .scale-row {

                font-size: 11px;
            }


            input[type="number"] {

                width: 66px;
                height: 30px;

                font-size: 13px;
            }


            .result {

                font-size: 9px;

                line-height: 1.18;
            }

        }


    </style>

</head>


<body>


<div class="main-container">


    <!-- ========================================
         左侧地图
         ======================================== -->

    <div
        id="mapContainer"
        class="map-container">

        <div
            id="mapStage"
            class="map-stage">


            <svg
                id="mapSvg"
                viewBox="0 0 700 700"
                preserveAspectRatio="xMidYMid meet"
                xmlns="http://www.w3.org/2000/svg">


                <!-- 背景 -->

                <rect
                    x="0"
                    y="0"
                    width="700"
                    height="700"
                    fill="white">
                </rect>


                <!-- 纵向网格 -->

                <line x1="70"  y1="70" x2="70"  y2="630"
                      stroke="black" stroke-width="1"/>

                <line x1="150" y1="70" x2="150" y2="630"
                      stroke="black" stroke-width="1"/>

                <line x1="230" y1="70" x2="230" y2="630"
                      stroke="black" stroke-width="1"/>

                <line x1="310" y1="70" x2="310" y2="630"
                      stroke="black" stroke-width="1"/>

                <line x1="390" y1="70" x2="390" y2="630"
                      stroke="black" stroke-width="1"/>

                <line x1="470" y1="70" x2="470" y2="630"
                      stroke="black" stroke-width="1"/>

                <line x1="550" y1="70" x2="550" y2="630"
                      stroke="black" stroke-width="1"/>

                <line x1="630" y1="70" x2="630" y2="630"
                      stroke="black" stroke-width="1"/>


                <!-- 横向网格 -->

                <line x1="70" y1="70"  x2="630" y2="70"
                      stroke="black" stroke-width="1"/>

                <line x1="70" y1="150" x2="630" y2="150"
                      stroke="black" stroke-width="1"/>

                <line x1="70" y1="230" x2="630" y2="230"
                      stroke="black" stroke-width="1"/>

                <line x1="70" y1="310" x2="630" y2="310"
                      stroke="black" stroke-width="1"/>

                <line x1="70" y1="390" x2="630" y2="390"
                      stroke="black" stroke-width="1"/>

                <line x1="70" y1="470" x2="630" y2="470"
                      stroke="black" stroke-width="1"/>

                <line x1="70" y1="550" x2="630" y2="550"
                      stroke="black" stroke-width="1"/>

                <line x1="70" y1="630" x2="630" y2="630"
                      stroke="black" stroke-width="1"/>


                <!-- 顶部数字 -->

                <g
                    font-family="Arial"
                    font-size="18"
                    font-weight="bold"
                    fill="black"
                    text-anchor="middle">

                    <text x="110" y="45">1</text>
                    <text x="190" y="45">2</text>
                    <text x="270" y="45">3</text>
                    <text x="350" y="45">4</text>
                    <text x="430" y="45">5</text>
                    <text x="510" y="45">6</text>
                    <text x="590" y="45">7</text>

                </g>


                <!-- 左侧字母 -->

                <g
                    font-family="Arial"
                    font-size="18"
                    font-weight="bold"
                    fill="black"
                    text-anchor="middle"
                    dominant-baseline="middle">

                    <text x="42" y="110">A</text>
                    <text x="42" y="190">B</text>
                    <text x="42" y="270">C</text>
                    <text x="42" y="350">D</text>
                    <text x="42" y="430">E</text>
                    <text x="42" y="510">F</text>
                    <text x="42" y="590">G</text>

                </g>


                <!-- 己方-目标连接线 -->

                <line
                    id="connectionLine"

                    x1="0"
                    y1="0"

                    x2="0"
                    y2="0"

                    stroke="black"

                    stroke-width="2"

                    stroke-dasharray="6 4"

                    visibility="hidden">
                </line>


                <!-- =========================
                     己方标记
                     ========================= -->

                <g
                    id="ownMarker"
                    visibility="hidden">

                    <circle
                        id="ownCircle"

                        cx="0"
                        cy="0"

                        r="8"

                        fill="blue">
                    </circle>

                    <text
                        id="ownMarkerText"

                        x="0"
                        y="0"

                        fill="blue"

                        font-family="Arial, Microsoft YaHei, PingFang SC"

                        font-size="14"

                        font-weight="bold"

                        text-anchor="middle">

                        己方坐标

                    </text>

                </g>


                <!-- =========================
                     目标标记
                     ========================= -->

                <g
                    id="targetMarker"
                    visibility="hidden">

                    <circle
                        id="targetCircle"

                        cx="0"
                        cy="0"

                        r="8"

                        fill="red">
                    </circle>

                    <text
                        id="targetMarkerText"

                        x="0"
                        y="0"

                        fill="red"

                        font-family="Arial, Microsoft YaHei, PingFang SC"

                        font-size="14"

                        font-weight="bold"

                        text-anchor="middle">

                        目标方位

                    </text>

                </g>


            </svg>


        </div>

    </div>



    <!-- ========================================
         右侧控制区域
         ======================================== -->

    <div class="control-panel">


        <!-- =========================
             地图缩放
             ========================= -->

        <div class="section-title">

            地图缩放

        </div>


        <div class="zoom-row">

            <button
                id="zoomOutButton"
                class="zoom-button">

                −

            </button>


            <input
                id="zoomSlider"
                type="range"
                min="70"
                max="160"
                step="5"
                value="100">


            <button
                id="zoomInButton"
                class="zoom-button">

                +

            </button>


            <div
                id="zoomValue"
                class="zoom-value">

                100%

            </div>

        </div>


        <button
            id="resetZoomButton"
            class="reset-zoom-button">

            地图恢复 100%

        </button>



        <div class="spacer"></div>



        <!-- =========================
             比例尺
             ========================= -->

        <div class="section-title">

            地图比例尺

        </div>


        <div class="scale-row">

            <span>1 格 =</span>

            <input
                id="scaleInput"
                type="number"
                inputmode="decimal"
                step="0.1">

            <span>m</span>

        </div>


        <button id="applyScaleButton">

            应用比例尺

        </button>



        <div class="spacer"></div>



        <!-- =========================
             位置设置
             ========================= -->

        <div class="section-title">

            位置设置

        </div>


        <button id="ownButton">

            设置己方位置

        </button>


        <button id="targetButton">

            设置目标方位

        </button>



        <div class="spacer"></div>



        <!-- =========================
             清除
             ========================= -->

        <div class="section-title">

            清除

        </div>


        <button id="clearOwnButton">

            清除己方位置

        </button>


        <button id="clearTargetButton">

            清除目标位置

        </button>


        <button id="clearAllButton">

            全部清零

        </button>



        <!-- =========================
             当前模式
             ========================= -->

        <div
            id="modeLabel"
            class="mode-label">

            当前模式：未选择

        </div>



        <!-- =========================
             结果
             ========================= -->

        <div
            id="resultLabel"
            class="result">
        </div>


    </div>


</div>



<script>


/* ========================================
   地图基础参数
   ======================================== */

const GRID_SIZE = 7;

const CELL_SIZE = 80;

const MAP_LEFT = 70;

const MAP_TOP = 70;

const MAP_SIZE =
    GRID_SIZE * CELL_SIZE;



/* ========================================
   当前状态
   ======================================== */

let scale = null;

let ownPoint = null;

let targetPoint = null;

let selectionMode = null;

let mapZoom = 100;



/* ========================================
   获取网页元素
   ======================================== */

const svg =
    document.getElementById("mapSvg");


const mapStage =
    document.getElementById("mapStage");


const mapContainer =
    document.getElementById("mapContainer");


const scaleInput =
    document.getElementById("scaleInput");


const applyScaleButton =
    document.getElementById("applyScaleButton");


const ownButton =
    document.getElementById("ownButton");


const targetButton =
    document.getElementById("targetButton");


const clearOwnButton =
    document.getElementById("clearOwnButton");


const clearTargetButton =
    document.getElementById("clearTargetButton");


const clearAllButton =
    document.getElementById("clearAllButton");


const modeLabel =
    document.getElementById("modeLabel");


const resultLabel =
    document.getElementById("resultLabel");


const zoomSlider =
    document.getElementById("zoomSlider");


const zoomValue =
    document.getElementById("zoomValue");


const zoomInButton =
    document.getElementById("zoomInButton");


const zoomOutButton =
    document.getElementById("zoomOutButton");


const resetZoomButton =
    document.getElementById("resetZoomButton");


const ownMarker =
    document.getElementById("ownMarker");


const ownCircle =
    document.getElementById("ownCircle");


const ownMarkerText =
    document.getElementById("ownMarkerText");


const targetMarker =
    document.getElementById("targetMarker");


const targetCircle =
    document.getElementById("targetCircle");


const targetMarkerText =
    document.getElementById("targetMarkerText");


const connectionLine =
    document.getElementById("connectionLine");



/* ========================================
   地图缩放
   ======================================== */

function updateMapZoom() {


    const factor =
        mapZoom / 100;


    mapStage.style.width =
        (100 * factor) + "%";


    mapStage.style.height =
        (100 * factor) + "%";


    zoomSlider.value =
        mapZoom;


    zoomValue.textContent =
        mapZoom + "%";

}



function setZoom(value) {


    mapZoom =
        Math.max(
            70,
            Math.min(
                160,
                value
            )
        );


    updateMapZoom();

}



zoomSlider.addEventListener(
    "input",

    function() {

        setZoom(
            Number(
                zoomSlider.value
            )
        );

    }
);



zoomInButton.addEventListener(
    "click",

    function() {

        setZoom(
            mapZoom + 10
        );

    }
);



zoomOutButton.addEventListener(
    "click",

    function() {

        setZoom(
            mapZoom - 10
        );

    }
);



resetZoomButton.addEventListener(
    "click",

    function() {

        setZoom(100);


        mapContainer.scrollLeft = 0;

        mapContainer.scrollTop = 0;

    }
);



/* ========================================
   选择位置模式
   ======================================== */

function selectOwnMode() {


    selectionMode = "own";


    modeLabel.textContent =
        "当前模式：设置己方位置";

}



function selectTargetMode() {


    selectionMode = "target";


    modeLabel.textContent =
        "当前模式：设置目标方位";

}



/* ========================================
   屏幕坐标转 SVG 坐标
   ======================================== */

function getSvgPoint(event) {


    const point =
        svg.createSVGPoint();


    point.x =
        event.clientX;


    point.y =
        event.clientY;


    const matrix =
        svg.getScreenCTM();


    if (!matrix) {

        return null;

    }


    const transformed =
        point.matrixTransform(
            matrix.inverse()
        );


    return {

        x: transformed.x,

        y: transformed.y

    };

}



/* ========================================
   点击地图
   ======================================== */

function mapClick(event) {


    if (selectionMode === null) {

        return;

    }


    const point =
        getSvgPoint(event);


    if (!point) {

        return;

    }


    const mapX =
        point.x - MAP_LEFT;


    const mapY =
        point.y - MAP_TOP;


    if (
        mapX < 0 ||
        mapY < 0 ||
        mapX >= MAP_SIZE ||
        mapY >= MAP_SIZE
    ) {

        return;

    }


    if (
        selectionMode === "own"
    ) {

        ownPoint = {

            x: mapX,

            y: mapY

        };

    }


    else if (
        selectionMode === "target"
    ) {

        targetPoint = {

            x: mapX,

            y: mapY

        };

    }


    selectionMode = null;


    modeLabel.textContent =
        "当前模式：未选择";


    updateMarkers();

    updateResult();

}



/* ========================================
   更新地图标记
   ======================================== */

function updateMarkers() {


    /* ---------- 己方 ---------- */

    if (ownPoint) {


        const x =
            MAP_LEFT + ownPoint.x;


        const y =
            MAP_TOP + ownPoint.y;


        ownCircle.setAttribute(
            "cx",
            x
        );


        ownCircle.setAttribute(
            "cy",
            y
        );


        ownMarkerText.setAttribute(
            "x",
            x
        );


        ownMarkerText.setAttribute(
            "y",
            y - 18
        );


        ownMarker.setAttribute(
            "visibility",
            "visible"
        );

    }


    else {

        ownMarker.setAttribute(
            "visibility",
            "hidden"
        );

    }



    /* ---------- 目标 ---------- */

    if (targetPoint) {


        const x =
            MAP_LEFT + targetPoint.x;


        const y =
            MAP_TOP + targetPoint.y;


        targetCircle.setAttribute(
            "cx",
            x
        );


        targetCircle.setAttribute(
            "cy",
            y
        );


        targetMarkerText.setAttribute(
            "x",
            x
        );


        targetMarkerText.setAttribute(
            "y",
            y - 18
        );


        targetMarker.setAttribute(
            "visibility",
            "visible"
        );

    }


    else {

        targetMarker.setAttribute(
            "visibility",
            "hidden"
        );

    }



    /* ---------- 连线 ---------- */

    if (
        ownPoint &&
        targetPoint
    ) {


        connectionLine.setAttribute(
            "x1",
            MAP_LEFT + ownPoint.x
        );


        connectionLine.setAttribute(
            "y1",
            MAP_TOP + ownPoint.y
        );


        connectionLine.setAttribute(
            "x2",
            MAP_LEFT + targetPoint.x
        );


        connectionLine.setAttribute(
            "y2",
            MAP_TOP + targetPoint.y
        );


        connectionLine.setAttribute(
            "visibility",
            "visible"
        );

    }


    else {

        connectionLine.setAttribute(
            "visibility",
            "hidden"
        );

    }

}



/* ========================================
   地图位置转换
   ======================================== */

function pixelToCoordinate(
    x,
    y
) {


    const gx =
        x / CELL_SIZE;


    const gy =
        y / CELL_SIZE;


    let column =
        Math.floor(gx);


    let row =
        Math.floor(gy);


    column =
        Math.max(
            0,
            Math.min(
                GRID_SIZE - 1,
                column
            )
        );


    row =
        Math.max(
            0,
            Math.min(
                GRID_SIZE - 1,
                row
            )
        );


    const number =
        column + 1;


    const letter =
        String.fromCharCode(
            "A".charCodeAt(0) + row
        );


    const xFraction =
        gx - column;


    const yFraction =
        gy - row;


    return {

        number: number,

        letter: letter,

        xFraction: xFraction,

        yFraction: yFraction

    };

}



/* ========================================
   格式化坐标
   ======================================== */

function formatCoordinate(point) {


    if (!point) {

        return "未设置";

    }


    const data =
        pixelToCoordinate(
            point.x,
            point.y
        );


    return (

        "横 " +

        data.number +

        " + " +

        data.xFraction.toFixed(2) +

        " 格，纵 " +

        data.letter +

        " + " +

        data.yFraction.toFixed(2) +

        " 格"

    );

}



/* ========================================
   距离计算
   ======================================== */

function calculateDistance() {


    if (
        !ownPoint ||
        !targetPoint
    ) {

        return null;

    }


    const dxGrid =

        Math.abs(
            targetPoint.x -
            ownPoint.x
        )

        / CELL_SIZE;


    const dyGrid =

        Math.abs(
            targetPoint.y -
            ownPoint.y
        )

        / CELL_SIZE;


    const gridDistance =

        Math.sqrt(

            dxGrid ** 2 +

            dyGrid ** 2

        );


    return {

        dxGrid: dxGrid,

        dyGrid: dyGrid,

        gridDistance: gridDistance

    };

}



/* ========================================
   设置比例尺
   ======================================== */

function updateScale() {


    const text =
        scaleInput.value.trim();


    if (text === "") {


        alert(
            "请输入比例尺，例如 157"
        );


        return;

    }


    const value =
        Number(text);


    if (
        !Number.isFinite(value) ||
        value <= 0
    ) {


        alert(
            "请输入有效比例尺，例如 157"
        );


        return;

    }


    scale = value;


    updateResult();

}



/* ========================================
   更新结果
   ======================================== */

function updateResult() {


    const ownText =
        formatCoordinate(
            ownPoint
        );


    const targetText =
        formatCoordinate(
            targetPoint
        );


    let text = "";


    text +=

        "己方：" +

        ownText +

        "\n";


    text +=

        "目标：" +

        targetText +

        "\n";


    if (scale === null) {


        text +=
            "比例尺：未设置\n";

    }


    else {


        text +=

            "比例尺：1格 = " +

            scale.toFixed(1) +

            " m\n";

    }


    const distance =
        calculateDistance();


    if (distance) {


        text +=
            "\n────── 距离 ──────\n";


        if (scale !== null) {


            text +=

                "横向：" +

                distance.dxGrid.toFixed(2) +

                " 格 / " +

                (
                    distance.dxGrid *
                    scale
                ).toFixed(1) +

                " m\n";


            text +=

                "纵向：" +

                distance.dyGrid.toFixed(2) +

                " 格 / " +

                (
                    distance.dyGrid *
                    scale
                ).toFixed(1) +

                " m\n";


            text +=

                "直线：" +

                distance.gridDistance.toFixed(2) +

                " 格 / " +

                (
                    distance.gridDistance *
                    scale
                ).toFixed(1) +

                " m";

        }


        else {


            text +=

                "横向：" +

                distance.dxGrid.toFixed(2) +

                " 格\n";


            text +=

                "纵向：" +

                distance.dyGrid.toFixed(2) +

                " 格\n";


            text +=

                "直线：" +

                distance.gridDistance.toFixed(2) +

                " 格\n";


            text +=
                "请输入比例尺计算米数。";

        }

    }


    resultLabel.textContent =
        text;

}



/* ========================================
   清除己方
   ======================================== */

function clearOwn() {


    ownPoint = null;


    selectionMode = null;


    modeLabel.textContent =
        "当前模式：未选择";


    updateMarkers();

    updateResult();

}



/* ========================================
   清除目标
   ======================================== */

function clearTarget() {


    targetPoint = null;


    selectionMode = null;


    modeLabel.textContent =
        "当前模式：未选择";


    updateMarkers();

    updateResult();

}



/* ========================================
   全部清零
   ======================================== */

function clearAll() {


    ownPoint = null;

    targetPoint = null;

    selectionMode = null;


    modeLabel.textContent =
        "当前模式：未选择";


    updateMarkers();

    updateResult();

}



/* ========================================
   事件绑定
   ======================================== */

ownButton.addEventListener(
    "click",
    selectOwnMode
);


targetButton.addEventListener(
    "click",
    selectTargetMode
);


applyScaleButton.addEventListener(
    "click",
    updateScale
);


clearOwnButton.addEventListener(
    "click",
    clearOwn
);


clearTargetButton.addEventListener(
    "click",
    clearTarget
);


clearAllButton.addEventListener(
    "click",
    clearAll
);


svg.addEventListener(
    "click",
    mapClick
);



/* ========================================
   初始化
   ======================================== */

updateMapZoom();

updateMarkers();

updateResult();


</script>


</body>
