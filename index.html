<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=5.0,
                 user-scalable=yes">

    <title>ZBD04A火控程序</title>


    <style>

        /* =========================================
           全局
           ========================================= */

        * {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            background: white;

            font-family:
                Arial,
                "Microsoft YaHei",
                "PingFang SC",
                sans-serif;

            overflow: hidden;

        }



        /* =========================================
           整个程序
           ========================================= */

        .main-container {

            width: 100vw;
            height: 100vh;

            display: flex;

            flex-direction: row;

            align-items: stretch;

            background: white;

        }



        /* =========================================
           左侧地图区域
           自动占据剩余空间
           ========================================= */

        .map-container {

            flex: 1;

            min-width: 0;

            height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 8px;

            overflow: hidden;

        }



        /* =========================================
           SVG 地图
           ========================================= */

        #mapSvg {

            display: block;

            width: 100%;

            height: 100%;

            max-width: 100%;

            max-height: 100%;

            background: white;

            touch-action: none;

            user-select: none;

            -webkit-user-select: none;

        }



        /* =========================================
           右侧控制区域
           ========================================= */

        .control-panel {

            width: 270px;

            min-width: 270px;

            height: 100vh;

            padding: 18px;

            background: white;

            border-left: 1px solid #dddddd;

            overflow-y: auto;

            flex-shrink: 0;

        }



        /* =========================================
           标题
           ========================================= */

        .section-title {

            font-size: 20px;

            font-weight: bold;

            text-align: center;

            margin-bottom: 10px;

        }



        /* =========================================
           比例尺
           ========================================= */

        .scale-row {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 6px;

            font-size: 16px;

            margin-bottom: 10px;

        }


        input {

            width: 90px;

            height: 38px;

            padding: 4px 6px;

            font-size: 18px;

            text-align: center;

            border: 1px solid #999999;

            border-radius: 4px;

            background: white;

        }



        /* =========================================
           按钮
           ========================================= */

        button {

            display: block;

            width: 100%;

            height: 46px;

            margin: 9px auto;

            border: 1px solid #bbbbbb;

            border-radius: 8px;

            background: #eeeeee;

            font-size: 16px;

            color: #007aff;

            cursor: pointer;

        }


        button:active {

            background: #dddddd;

        }



        /* =========================================
           间距
           ========================================= */

        .spacer {

            height: 15px;

        }



        /* =========================================
           当前模式
           ========================================= */

        .mode-label {

            margin-top: 20px;

            margin-bottom: 10px;

            text-align: center;

            font-size: 14px;

        }



        /* =========================================
           结果
           ========================================= */

        .result {

            margin-top: 12px;

            white-space: pre-line;

            font-family:
                Consolas,
                "Courier New",
                monospace;

            font-size: 13px;

            line-height: 1.55;

            text-align: left;

        }



        /* =========================================
           平板横屏
           ========================================= */

        @media (max-width: 1100px) {

            .control-panel {

                width: 230px;

                min-width: 230px;

                padding: 12px;

            }


            .section-title {

                font-size: 17px;

            }


            button {

                height: 42px;

                font-size: 14px;

            }


            .result {

                font-size: 12px;

            }

        }



        /* =========================================
           更窄屏幕
           ========================================= */

        @media (max-width: 800px) {

            .control-panel {

                width: 200px;

                min-width: 200px;

                padding: 8px;

            }


            button {

                height: 40px;

                font-size: 13px;

            }


            .section-title {

                font-size: 15px;

            }


            .scale-row {

                font-size: 13px;

            }


            input {

                width: 70px;

                height: 34px;

                font-size: 15px;

            }

        }


    </style>

</head>



<body>


<div class="main-container">


    <!-- =========================================
         左侧地图
         ========================================= -->

    <div class="map-container">


        <svg
            id="mapSvg"
            viewBox="0 0 700 700"
            preserveAspectRatio="xMidYMid meet"
            xmlns="http://www.w3.org/2000/svg">


            <!-- =================================
                 白色背景
                 ================================= -->

            <rect
                x="0"
                y="0"
                width="700"
                height="700"
                fill="white">
            </rect>



            <!-- =================================
                 地图网格

                 左上：
                 70,70

                 右下：
                 630,630

                 每格：
                 80
                 ================================= -->


            <!-- ================================
                 竖线
                 ================================ -->

            <line
                x1="70"
                y1="70"
                x2="70"
                y2="630"
                stroke="black"
                stroke-width="1"/>

            <line
                x1="150"
                y1="70"
                x2="150"
                y2="630"
                stroke="black"
                stroke-width="1"/>

            <line
                x1="230"
                y1="70"
                x2="230"
                y2="630"
                stroke="black"
                stroke-width="1"/>

            <line
                x1="310"
                y1="70"
                x2="310"
                y2="630"
                stroke="black"
                stroke-width="1"/>

            <line
                x1="390"
                y1="70"
                x2="390"
                y2="630"
                stroke="black"
                stroke-width="1"/>

            <line
                x1="470"
                y1="70"
                x2="470"
                y2="630"
                stroke="black"
                stroke-width="1"/>

            <line
                x1="550"
                y1="70"
                x2="550"
                y2="630"
                stroke="black"
                stroke-width="1"/>

            <line
                x1="630"
                y1="70"
                x2="630"
                y2="630"
                stroke="black"
                stroke-width="1"/>



            <!-- ================================
                 横线
                 ================================ -->

            <line
                x1="70"
                y1="70"
                x2="630"
                y2="70"
                stroke="black"
                stroke-width="1"/>

            <line
                x1="70"
                y1="150"
                x2="630"
                y2="150"
                stroke="black"
                stroke-width="1"/>

            <line
                x1="70"
                y1="230"
                x2="630"
                y2="230"
                stroke="black"
                stroke-width="1"/>

            <line
                x1="70"
                y1="310"
                x2="630"
                y2="310"
                stroke="black"
                stroke-width="1"/>

            <line
                x1="70"
                y1="390"
                x2="630"
                y2="390"
                stroke="black"
                stroke-width="1"/>

            <line
                x1="70"
                y1="470"
                x2="630"
                y2="470"
                stroke="black"
                stroke-width="1"/>

            <line
                x1="70"
                y1="550"
                x2="630"
                y2="550"
                stroke="black"
                stroke-width="1"/>

            <line
                x1="70"
                y1="630"
                x2="630"
                y2="630"
                stroke="black"
                stroke-width="1"/>



            <!-- =================================
                 横坐标
                 1 - 7
                 每个数字位于对应方格中央
                 ================================= -->

            <g
                font-family="Arial"
                font-size="18"
                font-weight="bold"
                fill="black"
                text-anchor="middle">


                <text
                    x="110"
                    y="45">
                    1
                </text>


                <text
                    x="190"
                    y="45">
                    2
                </text>


                <text
                    x="270"
                    y="45">
                    3
                </text>


                <text
                    x="350"
                    y="45">
                    4
                </text>


                <text
                    x="430"
                    y="45">
                    5
                </text>


                <text
                    x="510"
                    y="45">
                    6
                </text>


                <text
                    x="590"
                    y="45">
                    7
                </text>


            </g>



            <!-- =================================
                 纵坐标
                 A - G
                 每个字母位于对应方格中央
                 ================================= -->

            <g
                font-family="Arial"
                font-size="18"
                font-weight="bold"
                fill="black"
                text-anchor="middle"
                dominant-baseline="middle">


                <text
                    x="42"
                    y="110">
                    A
                </text>


                <text
                    x="42"
                    y="190">
                    B
                </text>


                <text
                    x="42"
                    y="270">
                    C
                </text>


                <text
                    x="42"
                    y="350">
                    D
                </text>


                <text
                    x="42"
                    y="430">
                    E
                </text>


                <text
                    x="42"
                    y="510">
                    F
                </text>


                <text
                    x="42"
                    y="590">
                    G
                </text>


            </g>



            <!-- =================================
                 自身与目标连线
                 ================================= -->

            <line
                id="connectionLine"

                x1="0"
                y1="0"

                x2="0"
                y2="0"

                stroke="black"

                stroke-width="2"

                stroke-dasharray="6 4"

                visibility="hidden">
            </line>



            <!-- =================================
                 自身位置
                 ================================= -->

            <g
                id="ownMarker"
                visibility="hidden">


                <circle
                    id="ownCircle"

                    cx="0"
                    cy="0"

                    r="8"

                    fill="blue">
                </circle>


                <text
                    id="ownMarkerText"

                    x="0"
                    y="0"

                    fill="blue"

                    font-family="Arial"

                    font-size="14"

                    font-weight="bold"

                    text-anchor="middle">

                    OWN

                </text>


            </g>



            <!-- =================================
                 目标位置
                 ================================= -->

            <g
                id="targetMarker"
                visibility="hidden">


                <circle
                    id="targetCircle"

                    cx="0"
                    cy="0"

                    r="8"

                    fill="red">
                </circle>


                <text
                    id="targetMarkerText"

                    x="0"
                    y="0"

                    fill="red"

                    font-family="Arial"

                    font-size="14"

                    font-weight="bold"

                    text-anchor="middle">

                    TARGET

                </text>


            </g>


        </svg>


    </div>



    <!-- =========================================
         右侧控制区域
         ========================================= -->

    <div class="control-panel">


        <!-- =====================================
             地图比例尺
             ===================================== -->

        <div class="section-title">

            地图比例尺

        </div>


        <div class="scale-row">


            <span>

                1 格 =

            </span>


            <!-- 默认空白 -->

            <input
                id="scaleInput"

                type="number"

                inputmode="decimal"

                step="0.1">


            <span>

                m

            </span>


        </div>


        <button id="applyScaleButton">

            应用比例尺

        </button>



        <!-- =====================================
             位置设置
             ===================================== -->

        <div class="spacer"></div>


        <div class="section-title">

            位置设置

        </div>


        <button id="ownButton">

            设置自身位置

        </button>


        <button id="targetButton">

            设置目标位置

        </button>



        <!-- =====================================
             清除
             ===================================== -->

        <div class="spacer"></div>


        <div class="section-title">

            清除

        </div>


        <button id="clearTargetButton">

            清除目标位置

        </button>


        <button id="clearAllButton">

            全部清零

        </button>



        <!-- =====================================
             当前模式
             ===================================== -->

        <div
            id="modeLabel"
            class="mode-label">

            当前模式：未选择

        </div>



        <!-- =====================================
             结果
             ===================================== -->

        <div
            id="resultLabel"
            class="result">
        </div>


    </div>


</div>



<script>


// ============================================
// 地图参数
// ============================================

const GRID_SIZE = 7;

const CELL_SIZE = 80;

const MAP_LEFT = 70;

const MAP_TOP = 70;

const MAP_SIZE =
    GRID_SIZE
    *
    CELL_SIZE;



// ============================================
// 程序状态
// ============================================


// 比例尺
// null = 尚未设置

let scale = null;


// 自身位置

let ownPoint = null;


// 目标位置

let targetPoint = null;


// 当前选择模式
//
// null
// own
// target

let selectionMode = null;



// ============================================
// 获取页面元素
// ============================================

const svg =
    document.getElementById(
        "mapSvg"
    );


const scaleInput =
    document.getElementById(
        "scaleInput"
    );


const applyScaleButton =
    document.getElementById(
        "applyScaleButton"
    );


const ownButton =
    document.getElementById(
        "ownButton"
    );


const targetButton =
    document.getElementById(
        "targetButton"
    );


const clearTargetButton =
    document.getElementById(
        "clearTargetButton"
    );


const clearAllButton =
    document.getElementById(
        "clearAllButton"
    );


const modeLabel =
    document.getElementById(
        "modeLabel"
    );


const resultLabel =
    document.getElementById(
        "resultLabel"
    );



const ownMarker =
    document.getElementById(
        "ownMarker"
    );


const ownCircle =
    document.getElementById(
        "ownCircle"
    );


const ownMarkerText =
    document.getElementById(
        "ownMarkerText"
    );



const targetMarker =
    document.getElementById(
        "targetMarker"
    );


const targetCircle =
    document.getElementById(
        "targetCircle"
    );


const targetMarkerText =
    document.getElementById(
        "targetMarkerText"
    );


const connectionLine =
    document.getElementById(
        "connectionLine"
    );



// ============================================
// 设置自身位置模式
// ============================================

function selectOwnMode() {


    selectionMode =
        "own";


    modeLabel.textContent =
        "当前模式：设置自身位置";

}



// ============================================
// 设置目标位置模式
// ============================================

function selectTargetMode() {


    selectionMode =
        "target";


    modeLabel.textContent =
        "当前模式：设置目标位置";

}



// ============================================
// 将屏幕触摸位置
// 转换成 SVG 内部坐标
// ============================================

function getSvgPoint(event) {


    const point =
        svg.createSVGPoint();


    point.x =
        event.clientX;


    point.y =
        event.clientY;


    const matrix =
        svg.getScreenCTM();


    if (!matrix) {

        return null;

    }


    const transformed =
        point.matrixTransform(
            matrix.inverse()
        );


    return {

        x:
            transformed.x,

        y:
            transformed.y

    };

}



// ============================================
// 点击地图
// ============================================

function mapClick(event) {


    // ========================================
    // 必须先选择自身或者目标
    // ========================================

    if (
        selectionMode === null
    ) {

        alert(
            "请先点击“设置自身位置”或“设置目标位置”"
        );

        return;

    }



    const point =
        getSvgPoint(
            event
        );


    if (!point) {

        return;

    }



    // ========================================
    // 转换成地图内部坐标
    // ========================================

    const mapX =
        point.x
        -
        MAP_LEFT;


    const mapY =
        point.y
        -
        MAP_TOP;



    // ========================================
    // 地图范围外无效
    // ========================================

    if (

        mapX < 0

        ||

        mapY < 0

        ||

        mapX >= MAP_SIZE

        ||

        mapY >= MAP_SIZE

    ) {

        return;

    }



    // ========================================
    // 设置自身位置
    // ========================================

    if (
        selectionMode === "own"
    ) {

        ownPoint = {

            x:
                mapX,

            y:
                mapY

        };

    }



    // ========================================
    // 设置目标位置
    // ========================================

    else if (
        selectionMode === "target"
    ) {

        targetPoint = {

            x:
                mapX,

            y:
                mapY

        };

    }



    // ========================================
    // 设置完成
    // ========================================

    selectionMode =
        null;


    modeLabel.textContent =
        "当前模式：未选择";


    updateMarkers();

    updateResult();

}



// ============================================
// 更新地图上的点
// ============================================

function updateMarkers() {


    // ========================================
    // 自身位置
    // ========================================

    if (ownPoint) {


        const x =
            MAP_LEFT
            +
            ownPoint.x;


        const y =
            MAP_TOP
            +
            ownPoint.y;



        ownCircle.setAttribute(
            "cx",
            x
        );


        ownCircle.setAttribute(
            "cy",
            y
        );


        ownMarkerText.setAttribute(
            "x",
            x
        );


        ownMarkerText.setAttribute(
            "y",
            y - 15
        );


        ownMarker.setAttribute(
            "visibility",
            "visible"
        );

    }

    else {


        ownMarker.setAttribute(
            "visibility",
            "hidden"
        );

    }



    // ========================================
    // 目标位置
    // ========================================

    if (targetPoint) {


        const x =
            MAP_LEFT
            +
            targetPoint.x;


        const y =
            MAP_TOP
            +
            targetPoint.y;



        targetCircle.setAttribute(
            "cx",
            x
        );


        targetCircle.setAttribute(
            "cy",
            y
        );


        targetMarkerText.setAttribute(
            "x",
            x
        );


        targetMarkerText.setAttribute(
            "y",
            y - 15
        );


        targetMarker.setAttribute(
            "visibility",
            "visible"
        );

    }

    else {


        targetMarker.setAttribute(
            "visibility",
            "hidden"
        );

    }



    // ========================================
    // 两点连线
    // ========================================

    if (
        ownPoint
        &&
        targetPoint
    ) {


        connectionLine.setAttribute(

            "x1",

            MAP_LEFT
            +
            ownPoint.x

        );


        connectionLine.setAttribute(

            "y1",

            MAP_TOP
            +
            ownPoint.y

        );


        connectionLine.setAttribute(

            "x2",

            MAP_LEFT
            +
            targetPoint.x

        );


        connectionLine.setAttribute(

            "y2",

            MAP_TOP
            +
            targetPoint.y

        );


        connectionLine.setAttribute(
            "visibility",
            "visible"
        );

    }

    else {


        connectionLine.setAttribute(
            "visibility",
            "hidden"
        );

    }

}



// ============================================
// 点击位置转换成坐标
// ============================================

function pixelToCoordinate(
    x,
    y
) {


    // ========================================
    // 横向
    // ========================================

    const gx =
        x
        /
        CELL_SIZE;


    let column =
        Math.floor(
            gx
        );


    column =
        Math.max(

            0,

            Math.min(

                GRID_SIZE - 1,

                column

            )

        );



    const number =
        column
        +
        1;


    const xFraction =
        gx
        -
        column;



    // ========================================
    // 纵向
    // ========================================

    const gy =
        y
        /
        CELL_SIZE;


    let row =
        Math.floor(
            gy
        );


    row =
        Math.max(

            0,

            Math.min(

                GRID_SIZE - 1,

                row

            )

        );



    const letter =
        String.fromCharCode(

            "A".charCodeAt(0)

            +

            row

        );


    const yFraction =
        gy
        -
        row;



    return {

        number:
            number,

        letter:
            letter,

        xFraction:
            xFraction,

        yFraction:
            yFraction

    };

}



// ============================================
// 格式化坐标
// ============================================

function formatCoordinate(
    point
) {


    if (!point) {

        return "未设置";

    }


    const data =
        pixelToCoordinate(

            point.x,

            point.y

        );


    return (

        "横 "
        +
        data.number

        +

        " + "

        +

        data.xFraction.toFixed(2)

        +

        " 格, "

        +

        "纵 "

        +

        data.letter

        +

        " + "

        +

        data.yFraction.toFixed(2)

        +

        " 格"

    );

}



// ============================================
// 距离计算
// ============================================

function calculateDistance() {


    if (

        !ownPoint

        ||

        !targetPoint

    ) {

        return null;

    }



    // ========================================
    // 横向格数
    // ========================================

    const dxGrid =
        Math.abs(

            targetPoint.x

            -

            ownPoint.x

        )

        /

        CELL_SIZE;



    // ========================================
    // 纵向格数
    // ========================================

    const dyGrid =
        Math.abs(

            targetPoint.y

            -

            ownPoint.y

        )

        /

        CELL_SIZE;



    // ========================================
    // 直线格距
    // ========================================

    const gridDistance =
        Math.sqrt(

            dxGrid ** 2

            +

            dyGrid ** 2

        );



    return {

        dxGrid:
            dxGrid,

        dyGrid:
            dyGrid,

        gridDistance:
            gridDistance

    };

}



// ============================================
// 更新比例尺
// ============================================

function updateScale() {


    const text =
        scaleInput.value.trim();



    // ========================================
    // 输入为空
    // ========================================

    if (
        text === ""
    ) {

        alert(
            "请输入比例尺，例如 157"
        );

        return;

    }



    const value =
        Number(
            text
        );



    // ========================================
    // 非法数字
    // ========================================

    if (

        !Number.isFinite(
            value
        )

        ||

        value <= 0

    ) {

        alert(
            "请输入有效比例尺，例如 157"
        );

        return;

    }



    scale =
        value;


    updateResult();

}



// ============================================
// 更新右侧数据显示
// ============================================

function updateResult() {


    const ownText =
        formatCoordinate(
            ownPoint
        );


    const targetText =
        formatCoordinate(
            targetPoint
        );



    // ========================================
    // 比例尺显示
    // ========================================

    let scaleText;


    if (
        scale === null
    ) {

        scaleText =
            "未设置";

    }

    else {

        scaleText =

            "1 格 = "

            +

            scale.toFixed(1)

            +

            " m";

    }



    let text =

        "自身坐标：\n"

        +

        ownText

        +

        "\n\n"


        +

        "目标坐标：\n"

        +

        targetText

        +

        "\n\n"


        +

        "比例尺：\n"

        +

        scaleText

        +

        "\n";



    const distance =
        calculateDistance();



    // ========================================
    // 两个位置都设置以后
    // ========================================

    if (distance) {


        text +=

            "\n"

            +

            "------ 距离数据 ------\n\n"

            +

            "横向差："

            +

            distance.dxGrid.toFixed(2)

            +

            " 格\n";



        // ====================================
        // 横向实际距离
        // ====================================

        if (
            scale !== null
        ) {

            text +=

                "横向距离："

                +

                (
                    distance.dxGrid
                    *
                    scale
                ).toFixed(1)

                +

                " m\n";

        }



        text +=

            "\n"

            +

            "纵向差："

            +

            distance.dyGrid.toFixed(2)

            +

            " 格\n";



        // ====================================
        // 纵向实际距离
        // ====================================

        if (
            scale !== null
        ) {

            text +=

                "纵向距离："

                +

                (
                    distance.dyGrid
                    *
                    scale
                ).toFixed(1)

                +

                " m\n";

        }



        text +=

            "\n"

            +

            "直线格距："

            +

            distance.gridDistance.toFixed(2)

            +

            " 格\n";



        // ====================================
        // 实际直线距离
        // ====================================

        if (
            scale !== null
        ) {

            text +=

                "实际直线距离："

                +

                (
                    distance.gridDistance
                    *
                    scale
                ).toFixed(1)

                +

                " m";

        }

        else {


            text +=

                "\n"

                +

                "请输入比例尺后计算实际米数。";

        }

    }



    resultLabel.textContent =
        text;

}



// ============================================
// 清除目标位置
// ============================================

function clearTarget() {


    targetPoint =
        null;


    selectionMode =
        null;


    modeLabel.textContent =
        "当前模式：未选择";


    updateMarkers();

    updateResult();

}



// ============================================
// 全部清零
//
// 注意：
// 比例尺不会被清空
// 只清除自身和目标位置
// ============================================

function clearAll() {


    ownPoint =
        null;


    targetPoint =
        null;


    selectionMode =
        null;


    modeLabel.textContent =
        "当前模式：未选择";


    updateMarkers();

    updateResult();

}



// ============================================
// 按钮事件
// ============================================

ownButton.addEventListener(

    "click",

    selectOwnMode

);


targetButton.addEventListener(

    "click",

    selectTargetMode

);


applyScaleButton.addEventListener(

    "click",

    updateScale

);


clearTargetButton.addEventListener(

    "click",

    clearTarget

);


clearAllButton.addEventListener(

    "click",

    clearAll

);



// ============================================
// 地图点击 / 平板触摸
// ============================================

svg.addEventListener(

    "pointerdown",

    mapClick

);



// 防止平板触摸地图时拖动网页

svg.addEventListener(

    "touchstart",

    function(event) {

        event.preventDefault();

    },

    {
        passive: false
    }

);



// ============================================
// 初始化
// ============================================

updateMarkers();

updateResult();


</script>


</body>

</html>
